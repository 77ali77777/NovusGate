version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: novusgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-novusgate}
      POSTGRES_USER: ${DB_USER:-novusgate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novusgate_secret}
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only: the control plane (host network) connects to
      # localhost:5432. A published port bypasses iptables INPUT rules, so
      # binding all addresses would expose the database to the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-novusgate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novusgate-network

  # Control Plane Server
  control-plane:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.control-plane
    container_name: novusgate-control-plane
    restart: unless-stopped
    # HOST NETWORK MODE: Required for WireGuard VPN to work properly
    # VPN traffic must pass through host network, not Docker bridge
    network_mode: host
    # PID namespace sharing for nsenter to access host processes (fail2ban)
    pid: host
    # Privileged mode for nsenter to work with host processes
    privileged: true
    environment:
      DATABASE_URL: postgres://${DB_USER:-novusgate}:${DB_PASSWORD:-novusgate_secret}@localhost:5432/${DB_NAME:-novusgate}?sslmode=disable
      novusgate_LISTEN: ":8080"
      novusgate_GRPC_LISTEN: ":8443"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}

      novusgate_API_KEY: ${API_KEY:-novusgate_secret_key}
      # Seals node private keys (64 hex); empty = stored unencrypted, with a warning
      NOVUSGATE_MASTER_KEY: ${MASTER_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT:-127.0.0.1}
      ADMIN_CIDR: ${ADMIN_CIDR:-10.99.0.0/24}
      # Firewall engine: iptables (default) | shadow (check only) | nft (enforce)
      FIREWALL_ENGINE: ${FIREWALL_ENGINE:-iptables}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WG_RECONCILER: ${WG_RECONCILER:-shadow}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_PTRACE
    volumes:
      # CRITICAL: Mount host's actual /etc/wireguard directory
      # This allows container to read keys created by installer
      - /etc/wireguard:/etc/wireguard:rw
      # Mount fail2ban log for reading
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      # Panel backups (P8) and Center update backups; uninstall keeps them
      - /var/backups/novusgate:/var/backups/novusgate
    # Note: With host network, ports are automatically exposed on host
    # Port 8080 (HTTP API), 8443 (gRPC), 51820 (WireGuard UDP)
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"



  # Web Dashboard
  web:
    build:
      context: ../../../web
      dockerfile: Dockerfile
    container_name: novusgate-web
    restart: unless-stopped
    network_mode: host
    environment:
      # nginx adds it to proxied /api requests; it is not built into the bundle
      NOVUSGATE_API_KEY: ${API_KEY:-novusgate_secret_key} # same default as control-plane
    # Port 3007 exposed via host network mode



networks:
  novusgate-network:
    driver: bridge
